# ──────────────────────────────────────────────────────────────────────────────
#  AMM — Nginx Production Config
#
#  Differences from nginx.conf (dev):
#    - server_name uses your EC2 Elastic IP / domain (set via env, see comments)
#    - /media/ is NOT served here — media files are on AWS S3
#    - Security headers added (X-Frame-Options, X-Content-Type-Options, etc.)
#    - Rate limiting for API endpoints
#    - Access log format is more detailed
#    - After you add a domain + SSL: uncomment the HTTPS server block at the bottom
#
#  In production, this file is mounted read-only at /etc/nginx/nginx.conf
# ──────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # ── Security ─────────────────────────────────────────────────────────────
    server_tokens off;    # Don't reveal Nginx version in error pages/headers

    # ── File upload size ─────────────────────────────────────────────────────
    # Allow large file uploads (profile pictures, chat attachments)
    client_max_body_size 20M;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # Limit API requests: 30 req/s per IP (burst of 60)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Stricter limit for auth endpoints: 5 req/s per IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # ── Upstream: Daphne ASGI server ──────────────────────────────────────────
    upstream django {
        server django:8000;
        keepalive 32;
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  HTTP Server — Port 80
    #  After adding a domain + SSL certificate, add a redirect here:
    #    return 301 https://$host$request_uri;
    #  and add the HTTPS server block at the bottom.
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.amuslimmatchmaker.com;

        # Once SSL certificate is obtained, uncomment the line below:
        # return 301 https://$host$request_uri;

        # ── Security headers ────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Static files ─────────────────────────────────────────────────────
        # Served directly by Nginx — never reaches Django.
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Media files ───────────────────────────────────────────────────────
        # NOT served here in production — media is on AWS S3.
        # Django/DRF returns the full S3 URL in API responses.
        # If you ever need to serve local media, uncomment and mount the volume:
        # location /media/ {
        #     alias /app/media/;
        #     expires 7d;
        #     add_header Cache-Control "public";
        #     access_log off;
        # }

        # ── Auth endpoints — strict rate limiting ────────────────────────────
        location ~ ^/api/(auth|users/register|users/login|users/password) {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;

            proxy_pass            http://django;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    60s;
            proxy_connect_timeout 60s;
            proxy_redirect        off;
        }

        # ── WebSocket — all ws/ routes ───────────────────────────────────────
        location /ws/ {
            proxy_pass          http://django;
            proxy_http_version  1.1;

            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Origin            $http_origin;

            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_buffering     off;
        }

        # ── Django API (all other HTTP requests) ─────────────────────────────
        location / {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;

            proxy_pass            http://django;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_http_version    1.1;
            proxy_set_header      Connection "";
            proxy_read_timeout    300s;
            proxy_connect_timeout 300s;
            proxy_redirect        off;
        }
    }

