name: Deploy to AWS EC2

# ── Trigger ───────────────────────────────────────────────────────────────────
# Only deploy when CI passes on main.
# The `workflow_run` trigger ensures CI completes successfully before deploy runs.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded (not just completed)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ── 1. Checkout (for any local scripts needed) ─────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. SSH setup ───────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # IMPORTANT: Use printf, not echo — echo strips the final newline
          # that OpenSSH private keys REQUIRE to be valid.
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          # Ensure there's exactly one trailing newline (some editors add none)
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Verify key format (should start with -----BEGIN)
          head -1 ~/.ssh/deploy_key
          # Add host to known_hosts to avoid interactive prompt
          ssh-keyscan -H -T 10 "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── 3. Deploy ──────────────────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          debug: true
          # Allow a cold EC2 Docker cache to download base images and packages.
          command_timeout: 45m
          script: |
            set -e
            echo "════════════════════════════════"
            echo "  AMM — Deployment Started"
            echo "════════════════════════════════"

            cd ~/amm-backend

            echo "→ Pulling latest code from main..."
            git pull origin main

            echo "→ Recreating containers with cached build layers..."
            for attempt in 1 2 3; do
              if docker compose -f docker-compose.prod.yml --env-file .env.production build; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Docker build failed after 3 attempts."
                exit 1
              fi
              echo "Build attempt $attempt failed; retrying in 15 seconds..."
              sleep 15
            done

            docker compose -f docker-compose.prod.yml --env-file .env.production \
              up -d --no-build --remove-orphans --force-recreate

            echo "→ Waiting for Django to become healthy..."
            django_ready=false
            for i in $(seq 1 24); do
              if docker compose -f docker-compose.prod.yml --env-file .env.production \
                  exec -T django python manage.py check --deploy 2>/dev/null; then
                echo "✅ Django is healthy."
                django_ready=true
                break
              fi
              echo "   Not ready yet ($i/24) — waiting 5s..."
              sleep 5
            done
            if [ "$django_ready" != "true" ]; then
              echo "Django did not become healthy within 120 seconds."
              docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=100 django
              exit 1
            fi

            echo "→ Running database migrations..."
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              exec -T django python manage.py migrate --noinput

            echo "→ Collecting static files..."
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              exec -T django python manage.py collectstatic --noinput

            echo "→ Pruning unused Docker images..."
            docker image prune -f --filter "until=168h"

            echo "════════════════════════════════"
            echo "  ✅ Deployment complete!"
            echo "════════════════════════════════"

      # ── 4. Deployment notification ─────────────────────────────────────────
      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ AMM deployed successfully to ${{ secrets.EC2_HOST }}"
          else
            echo "❌ AMM deployment FAILED — check logs above"
          fi
