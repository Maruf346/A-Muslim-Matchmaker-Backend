# ──────────────────────────────────────────────────────────────────────────────
#  AMM (A Muslim Matchmaker) — Nginx reverse proxy (local dev + prod-ready structure)
#
#  Handles:
#    HTTP  → proxy to Daphne on django:8000
#    WS    → upgrade + proxy to Daphne (notifications, chat)
#    /static/ → served directly by Nginx from the shared named volume
#    /media/  → served directly by Nginx from the shared named volume
#
#  Note: Host-side access is on port 8001 (see docker-compose.yml ports
#  mapping "8001:80") — this file only configures the internal container
#  port 80, which Nginx always listens on regardless of the host mapping.
# ──────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;

    # Allow large file uploads (profile pictures, photos, chat attachments)
    client_max_body_size 20M;

    # Gzip for API responses and static assets
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Upstream: Daphne ASGI server inside the django container
    upstream django {
        server django:8000;
    }

    server {
        listen 80;
        server_name _;   # Catch-all; replace with your domain in production

        # ── Static files ────────────────────────────────────────────────────
        # Served directly by Nginx — never reaches Django.
        # The static_data volume is mounted read-only here.
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Media files (user uploads) ───────────────────────────────────────
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ── WebSocket — all ws/ routes ─────────────────────────────────────
        # Single block handles both WS consumers:
        #   /ws/notifications/      (admin only)
        #   /ws/chat/<room_id>/     (normal user: own room, admin: any room)
        #
        # Key points:
        #   1. proxy_set_header Origin ""  — stops AllowedHostsOriginValidator
        #      from seeing a mismatched/missing Origin and returning 403.
        #      (AllowedHostsOriginValidator is NOT used in core/asgi.py for
        #       this exact reason — but this header pass-through keeps Nginx
        #       safe even if it's ever re-added.)
        #   2. proxy_read_timeout 86400s   — keeps long-lived WS connections
        #      alive (default 60s would kill idle connections).
        #   3. proxy_buffering off         — disables response buffering so
        #      frames are forwarded immediately rather than accumulated.
        location /ws/ {
            proxy_pass          http://django;
            proxy_http_version  1.1;

            # Required headers for WebSocket upgrade
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";

            # Standard proxy headers
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            # Pass Origin through (or empty string if client didn't send one).
            # This prevents Nginx from stripping it, which caused 403s from
            # AllowedHostsOriginValidator when Origin was absent.
            proxy_set_header    Origin            $http_origin;

            # Keep WS connections alive — idle connections would be killed
            # at the default 60s timeout without these.
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;

            # Forward frames immediately — no buffering
            proxy_buffering     off;
        }

        # ── Django API (all other HTTP requests) ───────────────────────────
        location / {
            proxy_pass            http://django;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    300s;
            proxy_connect_timeout 300s;
            proxy_redirect        off;
        }
    }
}
